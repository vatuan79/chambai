<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d5c96">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Chấm Bài</title>
<style>
:root{--pri:#1d5c96;--pri2:#e8f0f8;--ok:#1e8a4c;--okbg:#e3f4ea;--bad:#c63b2f;--badbg:#fbe6e3;--warn:#b86e00;--warnbg:#fff2dc;--ai:#6a3fb5;--aibg:#f1ebfb;--mut:#6b7480;--line:#dde2e8;--bg:#f4f6f9;--card:#fff;--txt:#1d232b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:10px 14px 9px;display:flex;align-items:center;gap:10px}
header .t{flex:1;min-width:0}
header h1{margin:0;font-size:17px;font-weight:700}
header .sub{font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .net{font-size:11.5px;padding:3px 8px;border-radius:99px;background:#ffffff26;white-space:nowrap}
header .net.off{background:#c63b2f}
main{padding:12px 12px 90px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:7px 2px 8px;font-size:11.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px}
nav button .ic{font-size:20px;line-height:24px}
nav button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 8px}
.card h3{font-size:14.5px;margin:12px 0 6px}
.muted{color:var(--mut);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;font-family:inherit}
.btn.sec{background:#fff;color:var(--pri)}
.btn.red{background:#fff;color:var(--bad);border-color:#e6b4ae}
.btn.ai{background:var(--ai);border-color:var(--ai)}
.btn.ai.sec{background:#fff;color:var(--ai)}
.btn.big{width:100%;padding:15px;font-size:17px;border-radius:12px}
.btn.sm{padding:6px 10px;font-size:13.5px;border-radius:8px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:120px}
label.f{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;border:1px solid #c9d1db;border-radius:9px;padding:9px 10px;font-size:15px;background:#fff;color:var(--txt);font-family:inherit}
textarea{min-height:86px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #9cc0e6;border-color:var(--pri)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;background:var(--pri2);color:var(--pri);font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.ai{background:var(--aibg);color:var(--ai)}
.warnbox{background:var(--warnbg);color:#7a4a00;border-radius:9px;padding:8px 10px;font-size:13.5px;margin:8px 0}
.errbox{background:var(--badbg);color:#8b2219;border-radius:9px;padding:10px 12px;font-size:14px;margin:8px 0}
.okbox{background:var(--okbg);color:#155f35;border-radius:9px;padding:8px 10px;font-size:13.5px;margin:8px 0}
.aibox{background:var(--aibg);color:#3f2370;border-radius:9px;padding:9px 11px;font-size:13.5px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12.5px;color:var(--mut);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
.scorebig{font-size:34px;font-weight:800;line-height:1;color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.chip{border:1px solid var(--line);border-radius:8px;padding:4px 2px;text-align:center;font-size:12px;background:#fff;cursor:pointer;user-select:none}
.chip b{display:block;font-size:17px;line-height:20px}
.chip.ok{background:var(--okbg);border-color:#b4dec4;color:var(--ok)}
.chip.bad{background:var(--badbg);border-color:#efc0ba;color:var(--bad)}
.chip.blank{background:#f2f3f5;color:#8a929c}
.chip.multi{background:var(--warnbg);border-color:#f0d29d;color:var(--warn)}
.chip .k{font-size:10.5px;opacity:.8}
canvas.photo{width:100%;border-radius:10px;border:1px solid var(--line);display:block;background:#222}
img.nameimg{display:block;width:100%;max-width:420px;border:1px solid var(--line);border-radius:6px;background:#fff}
img.namethumb{display:block;height:24px;max-width:170px;border-radius:3px;border:1px solid var(--line)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.thumbs img{height:84px;border-radius:6px;border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats div{background:var(--pri2);border-radius:10px;padding:8px 2px}
.stats b{display:block;font-size:20px;color:var(--pri)}
.stats span{font-size:11.5px;color:var(--mut)}
.bar{height:8px;border-radius:4px;background:#eef1f4;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.low i{background:var(--bad)}
.seg{display:flex;border:1px solid var(--pri);border-radius:9px;overflow:hidden;margin:4px 0 10px}
.seg button{flex:1;border:0;background:#fff;color:var(--pri);padding:8px;font-size:14px;font-weight:600;font-family:inherit}
.seg button.on{background:var(--pri);color:#fff}
.keybox{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;background:#fafbfc}
.essayitem{border:1px solid #ddd2f0;border-radius:10px;padding:10px;margin-top:8px;background:#fcfaff}
.essayitem .tr{white-space:pre-wrap;font-size:13.5px;background:#fff;border:1px dashed #d6cbe9;border-radius:8px;padding:8px;margin-top:6px;max-height:220px;overflow:auto}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222d;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90%;text-align:center}
.modal{position:fixed;inset:0;background:#0007;z-index:15;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:#fff;width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px 24px}
.steps{counter-reset:s;padding:0;margin:6px 0 0;list-style:none}
.steps li{counter-increment:s;padding:6px 0 6px 34px;position:relative}
.steps li:before{content:counter(s);position:absolute;left:0;top:5px;width:24px;height:24px;border-radius:50%;background:var(--pri);color:#fff;text-align:center;font-weight:700;font-size:13px;line-height:24px}
.svgprev{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.svgprev svg{width:100%;height:auto;display:block}
#printArea{display:none}
.hidden{display:none!important}
.spin{display:inline-block;width:16px;height:16px;border:3px solid #6a3fb544;border-top-color:#6a3fb5;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
.spin.w{border-color:#fff6;border-top-color:#fff}
@keyframes sp{to{transform:rotate(360deg)}}
@media print{
  body{background:#fff}
  header,main,nav,.toast,.modal{display:none!important}
  #printArea{display:block}
  #printArea svg{width:210mm;height:297mm;display:block;page-break-after:always}
  @page{size:A4;margin:0}
}
</style>
</head>
<body>
<header><div class="t"><h1>📝 Chấm Bài</h1><div class="sub" id="hdrSub"></div></div><span class="net" id="net"></span></header>
<main id="main"><div class="card">Đang mở…</div></main>
<nav id="nav"></nav>
<div id="printArea"></div>
<input type="file" id="fileCam" accept="image/*" capture="environment" class="hidden">
<input type="file" id="fileMulti" accept="image/*" multiple class="hidden">
<input type="file" id="fileKey" accept="image/*" class="hidden">
<input type="file" id="fileEssayCam" accept="image/*" capture="environment" class="hidden">
<input type="file" id="fileEssayPick" accept="image/*" multiple class="hidden">
<input type="file" id="fileBackup" accept=".json,application/json" class="hidden">
<input type="file" id="fileClass" accept=".xlsx,.xls,.csv,.txt,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" class="hidden">
<script>
/* OMR core: sheet layout, printable SVG, and photo recognition.
   Works in browser (window.OMR) and Node (module.exports). */
(function (root) {
  'use strict';

  // ---------- Sheet layout (millimetres, A4 portrait) ----------
  const L = {
    W: 210, H: 297,
    markSize: 9,
    marks: [[13, 13], [197, 13], [197, 284], [13, 284]], // TL, TR, BR, BL
    bar: { x: 26, y: 10, w: 20, h: 6 },
    midMarks: [[10, 148.5], [200, 148.5]],                // 6 mm check squares
    midSize: 6,                  // orientation bar next to TL mark
    whiteRefs: [[60, 13], [90, 13], [120, 13], [150, 13], [178, 13], [105, 16], [60, 284], [105, 284], [150, 284], [105, 277]],
    bubbleR: 2.5,
    sbd: null,
    made: { x0: 30, dx: 7, y0: 69, dy: 6, cols: 3 },
    nameBox: { x: 18, y: 34, w: 132, h: 14 },
    classBox: { x: 154, y: 34, w: 38, h: 14 },
    ans: { bx0: 18, bdx: 35, numOff: 8, ox: 12.5, odx: 6, y0: 140, dy: 13, rows: 10, blocks: 5 },
    nQ: 50,
    opts: ['A', 'B', 'C', 'D']
  };

  function sbdPos(c, d) { return L.sbd ? [L.sbd.x0 + c * L.sbd.dx, L.sbd.y0 + d * L.sbd.dy] : [0, 0]; }
  function madePos(c, d) { return [L.made.x0 + c * L.made.dx, L.made.y0 + d * L.made.dy]; }
  function ansPos(q, o) {
    const a = L.ans, b = Math.floor(q / a.rows), r = q % a.rows;
    return [a.bx0 + b * a.bdx + a.ox + o * a.odx, a.y0 + r * a.dy];
  }

  // ---------- Printable sheet ----------
  function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  function sheetSVG(opt) {
    opt = opt || {};
    const school = opt.school || '';
    const title = opt.title || '';
    const fill = opt.fill || null; // testing only: {sbd:'0123', made:'101', answers:'ABCD..'}
    const font = "font-family='Arial, Helvetica, sans-serif'";
    let s = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 210 297' width='210mm' height='297mm' ${font}>`;
    s += `<rect width='210' height='297' fill='#fff'/>`;
    const m = L.markSize / 2;
    for (const [x, y] of L.marks) s += `<rect x='${x - m}' y='${y - m}' width='${L.markSize}' height='${L.markSize}' fill='#000'/>`;
    for (const [x, y] of L.midMarks) s += `<rect x='${x - L.midSize / 2}' y='${y - L.midSize / 2}' width='${L.midSize}' height='${L.midSize}' fill='#000'/>`;
    s += `<rect x='${L.bar.x}' y='${L.bar.y}' width='${L.bar.w}' height='${L.bar.h}' fill='#000'/>`;

    // header
    s += `<text x='105' y='24.5' font-size='5.6' font-weight='bold' text-anchor='middle'>PHIẾU TRẢ LỜI TRẮC NGHIỆM</text>`;
    if (school || title) s += `<text x='105' y='30.3' font-size='3.2' text-anchor='middle'>${esc([school, title].filter(Boolean).join(' · '))}</text>`;
    const nb = L.nameBox, cb = L.classBox;
    s += `<rect x='${nb.x}' y='${nb.y}' width='${nb.w}' height='${nb.h}' fill='none' stroke='#333' stroke-width='0.4' rx='1'/>`;
    s += `<text x='${nb.x + 1.5}' y='${nb.y + 3}' font-size='2.4' fill='#666' font-weight='bold'>HỌ VÀ TÊN (viết rõ, đủ dấu)</text>`;
    s += `<rect x='${cb.x}' y='${cb.y}' width='${cb.w}' height='${cb.h}' fill='none' stroke='#333' stroke-width='0.4' rx='1'/>`;
    s += `<text x='${cb.x + 1.5}' y='${cb.y + 3}' font-size='2.4' fill='#666' font-weight='bold'>LỚP</text>`;
    if (fill && fill.name) s += `<text x='${nb.x + 6}' y='${nb.y + 11}' font-size='6' font-family='cursive' fill='#1a2a6c'>${esc(fill.name)}</text>`;

    // ID blocks
    function idBlock(label, cfg, posFn, val) {
      const xL = cfg.x0 - 5, xR = cfg.x0 + (cfg.cols - 1) * cfg.dx + 5;
      const cx = (xL + xR) / 2;
      let t = `<rect x='${xL}' y='51' width='${xR - xL}' height='76' fill='none' stroke='#333' stroke-width='0.35' rx='1'/>`;
      t += `<text x='${cx}' y='55.6' font-size='3' font-weight='bold' text-anchor='middle'>${label}</text>`;
      for (let c = 0; c < cfg.cols; c++) {
        const x = cfg.x0 + c * cfg.dx;
        t += `<rect x='${x - 3}' y='58' width='6' height='7' fill='none' stroke='#555' stroke-width='0.25'/>`;
        for (let d = 0; d < 10; d++) {
          const [bx, by] = posFn(c, d);
          t += bubble(bx, by, String(d));
          if (val && val[c] === String(d)) t += pencil(bx, by);
        }
      }
      return t;
    }
    function bubble(x, y, label) {
      return `<circle cx='${x}' cy='${y}' r='${L.bubbleR}' fill='none' stroke='#555' stroke-width='0.25'/>` +
        `<text x='${x}' y='${y + 0.95}' font-size='2.7' fill='#b8b8b8' text-anchor='middle'>${label}</text>`;
    }
    function pencil(x, y, op) {
      const dx = (Math.random() - 0.5) * 0.6, dy = (Math.random() - 0.5) * 0.6;
      return `<ellipse cx='${x + dx}' cy='${y + dy}' rx='${2.3 + Math.random() * 0.3}' ry='${2.1 + Math.random() * 0.4}' fill='#3a3a3a' opacity='${op || (fill && fill.op) || 0.9}'/>`;
    }
    if (L.sbd) s += idBlock('SỐ BÁO DANH', L.sbd, sbdPos, fill && fill.sbd);
    s += idBlock('MÃ ĐỀ', L.made, madePos, fill && fill.made);

    // instructions
    const ix = 58;
    s += `<rect x='${ix - 3}' y='51' width='140' height='76' fill='none' stroke='#333' stroke-width='0.35' rx='1'/>`;
    s += `<text x='${ix}' y='57' font-size='3.2' font-weight='bold'>HƯỚNG DẪN</text>`;
    const tips = ['• Viết họ tên rõ ràng, đủ dấu vào ô HỌ VÀ TÊN; viết mã đề vào ô trống rồi tô số tương ứng.',
      '• Dùng bút chì 2B hoặc bút bi đen/xanh đậm. Mỗi câu chỉ tô kín, đậm MỘT ô.',
      '• Phần tự luận làm ở mặt sau phiếu (hoặc giấy riêng).',
      '• Không gấp phiếu, không làm bẩn 4 ô vuông đen ở góc.'];
    tips.forEach((t, i) => { s += `<text x='${ix}' y='${63 + i * 5}' font-size='2.75'>${esc(t)}</text>`; });
    s += `<text x='${ix}' y='88' font-size='2.9'>Tô đúng:</text>`;
    s += `<circle cx='${ix + 17}' cy='87' r='2.5' fill='#222'/>`;
    s += `<text x='${ix + 27}' y='88' font-size='2.9'>Tô sai:</text>`;
    const wx = ix + 43;
    s += `<circle cx='${wx}' cy='87' r='2.5' fill='none' stroke='#555' stroke-width='0.25'/><path d='M${wx - 1.4} 87 l1 1.2 l2 -2.6' stroke='#222' stroke-width='0.5' fill='none'/>`;
    s += `<circle cx='${wx + 7}' cy='87' r='2.5' fill='none' stroke='#555' stroke-width='0.25'/><path d='M${wx + 5.5} 85.5 l3 3 M${wx + 8.5} 85.5 l-3 3' stroke='#222' stroke-width='0.5'/>`;
    s += `<circle cx='${wx + 14}' cy='87' r='2.5' fill='none' stroke='#555' stroke-width='0.25'/><path d='M${wx + 14} 84.5 a2.5 2.5 0 0 1 0 5 z' fill='#222'/>`;
    ['ĐIỂM TRẮC NGHIỆM', 'ĐIỂM TỰ LUẬN', 'TỔNG ĐIỂM'].forEach((lb, i) => {
      const bx = ix + i * 45;
      s += `<rect x='${bx}' y='95' width='42' height='28' fill='none' stroke='#555' stroke-width='0.3'/>`;
      s += `<text x='${bx + 2}' y='99.5' font-size='2.6' font-weight='bold'>${lb}</text>`;
    });

    // answers
    const a = L.ans;
    s += `<rect x='16.5' y='129' width='177' height='134' fill='none' stroke='#333' stroke-width='0.35' rx='1'/>`;
    const sepY = a.y0 + 4.5 * a.dy;
    s += `<line x1='18' y1='${sepY}' x2='192' y2='${sepY}' stroke='#bbb' stroke-width='0.25' stroke-dasharray='1 1'/>`;
    for (let b = 0; b < a.blocks; b++) {
      const bx = a.bx0 + b * a.bdx;
      if (b > 0) s += `<line x1='${bx}' y1='131' x2='${bx}' y2='261' stroke='#ccc' stroke-width='0.25'/>`;
      L.opts.forEach((o, oi) => {
        s += `<text x='${bx + a.ox + oi * a.odx}' y='135' font-size='3.2' font-weight='bold' text-anchor='middle'>${o}</text>`;
      });
      for (let r = 0; r < a.rows; r++) {
        const q = b * a.rows + r;
        const y = a.y0 + r * a.dy;
        s += `<text x='${bx + a.numOff}' y='${y + 1.15}' font-size='3.3' font-weight='bold' text-anchor='end'>${q + 1}</text>`;
        L.opts.forEach((o, oi) => {
          const [px, py] = ansPos(q, oi);
          s += bubble(px, py, o);
          if (fill && fill.answers) {
            const ch = fill.answers[q];
            if (ch === o || (ch === '*' && oi < 2)) s += pencil(px, py);
            const ex = fill.extra && fill.extra[q];
            if (ex && ex[0] === o) s += pencil(px, py, ex[1]);
          }
        });
      }
    }
    s += `<text x='105' y='271' font-size='2.6' fill='#555' text-anchor='middle'>Phần tự luận làm ở mặt sau · Khi chụp: đặt phẳng, đủ sáng, thấy rõ cả 4 ô vuông đen.</text>`;
    s += `</svg>`;
    return s;
  }

  function backSVG(opt) {
    opt = opt || {};
    const font = "font-family='Arial, Helvetica, sans-serif'";
    let s = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 210 297' width='210mm' height='297mm' ${font}>`;
    s += `<rect width='210' height='297' fill='#fff'/>`;
    s += `<text x='105' y='20' font-size='5.4' font-weight='bold' text-anchor='middle'>PHẦN TỰ LUẬN</text>`;
    if (opt.title) s += `<text x='105' y='26' font-size='3.2' text-anchor='middle'>${esc(opt.title)}</text>`;
    s += `<text x='15' y='35' font-size='3.4'>Họ và tên:</text><line x1='33' y1='35.6' x2='140' y2='35.6' stroke='#777' stroke-width='0.25' stroke-dasharray='0.6 0.8'/>`;
    s += `<text x='145' y='35' font-size='3.4'>Lớp:</text><line x1='153' y1='35.6' x2='195' y2='35.6' stroke='#777' stroke-width='0.25' stroke-dasharray='0.6 0.8'/>`;
    for (let y = 47; y <= 285; y += 8) s += `<line x1='15' y1='${y}' x2='195' y2='${y}' stroke='#c9ced6' stroke-width='0.25'/>`;
    s += `</svg>`;
    return s;
  }

  // ---------- Linear algebra ----------
  function homography(src, dst) {
    const A = [], bvec = [];
    for (let i = 0; i < 4; i++) {
      const [x, y] = src[i], [u, v] = dst[i];
      A.push([x, y, 1, 0, 0, 0, -x * u, -y * u]); bvec.push(u);
      A.push([0, 0, 0, x, y, 1, -x * v, -y * v]); bvec.push(v);
    }
    const h = solve(A, bvec);
    if (!h) return null;
    h.push(1);
    return h;
  }
  function solve(A, b) {
    const n = b.length;
    const M = A.map((r, i) => r.concat([b[i]]));
    for (let c = 0; c < n; c++) {
      let p = c;
      for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
      if (Math.abs(M[p][c]) < 1e-12) return null;
      [M[c], M[p]] = [M[p], M[c]];
      for (let r = 0; r < n; r++) {

  if (probs.length && !confirm('Đáp án chưa đủ số câu:\n' + probs.join('\n') + '\n\nVẫn lưu?')) return;

  const i = DB.tests.findIndex(t => t.id === obj.id);
  if (i >= 0) DB.tests[i] = obj; else DB.tests.push(obj);
  DB.cur = obj.id; editing = null; save(); toast('Đã lưu bài kiểm tra'); tab = 'scan'; render();
}

}

// ---------- Import names from Excel (.xlsx) / CSV ----------
async function readZip(buf){
  const dv = new DataView(buf); let e = buf.byteLength - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('notzip');
  const n = dv.getUint16(e + 10, true); let off = dv.getUint32(e + 16, true); const files = {};
  for (let i = 0; i < n; i++) {
    const method = dv.getUint16(off + 10, true), csize = dv.getUint32(off + 20, true), nl = dv.getUint16(off + 28, true), el = dv.getUint16(off + 30, true), cl = dv.getUint16(off + 32, true), lho = dv.getUint32(off + 42, true);
    files[new TextDecoder().decode(new Uint8Array(buf, off + 46, nl))] = { method, csize, lho }; off += 46 + nl + el + cl;
  }
  return { files, async text(name){
    const f = files[name]; if (!f) return null;
    const lnl = dv.getUint16(f.lho + 26, true), lel = dv.getUint16(f.lho + 28, true), data = new Uint8Array(buf, f.lho + 30 + lnl + lel, f.csize);
    if (f.method === 0) return new TextDecoder().decode(data);
    const out = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
    return new TextDecoder().decode(out);
  } };
}
const xmlDoc = t => new DOMParser().parseFromString(t, 'application/xml');
function colIdx(ref){ const m = /^([A-Z]+)/.exec(ref || ''); let n = 0; if (m) for (const ch of m[1]) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; }
async function readXlsx(buf){
  const z = await readZip(buf);
  const ss = []; const sst = await z.text('xl/sharedStrings.xml');
  if (sst) for (const si of xmlDoc(sst).getElementsByTagName('si')) ss.push([...si.getElementsByTagName('t')].map(t => t.textContent).join(''));
  const wb = xmlDoc(await z.text('xl/workbook.xml')), rels = xmlDoc((await z.text('xl/_rels/workbook.xml.rels')) || '<r/>');
  const relMap = {}; for (const r of rels.getElementsByTagName('Relationship')) relMap[r.getAttribute('Id')] = r.getAttribute('Target');
  const sheets = [];
  for (const sh of wb.getElementsByTagName('sheet')) {
    const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    let target = relMap[rid] || ''; target = target.startsWith('/') ? target.slice(1) : 'xl/' + target.replace(/^\.\//, '');
    const x = await z.text(target); if (!x) continue;
    const rows = [];
    for (const row of xmlDoc(x).getElementsByTagName('row')) {
      const arr = [];
      for (const c of row.getElementsByTagName('c')) {
        const t = c.getAttribute('t'), v = c.getElementsByTagName('v')[0];
        let val = '';
        if (t === 's') val = ss[+(v && v.textContent)] || '';
        else if (t === 'inlineStr') val = [...c.getElementsByTagName('t')].map(n => n.textContent).join('');
        else val = v ? v.textContent : '';
        arr[colIdx(c.getAttribute('r'))] = String(val).trim();
      }
      rows.push(arr);
    }
    sheets.push({ name: sh.getAttribute('name'), rows });
  }
  return sheets;
}
function parseCSV(text){
  const sep = (text.split('\n')[0].match(/;/g) || []).length > (text.split('\n')[0].match(/,/g) || []).length ? ';' : (text.includes('\t') ? '\t' : ',');
  return text.split(/\r?\n/).map(l => { const out = []; let cur = '', q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === sep && !q) { out.push(cur.trim()); cur = ''; } else cur += ch; } out.push(cur.trim()); return out; });
}
const looksName = v => { v = String(v || '').trim(); if (v.length < 4 || v.length > 45 || !/^[\p{L} .'\-]+$/u.test(v)) return false; const w = v.split(/\s+/).length; return w >= 2 && w <= 6; };
function namesFromRows(rows){
  const H = r => norm(r || '');
  let hdr = -1, nameCol = -1, hoCol = -1, tenCol = -1;
  for (let i = 0; i < Math.min(rows.length, 20) && hdr < 0; i++) {
    const r = rows[i] || [];
    r.forEach((v, j) => {
      const h = H(v);
      if (/^(ho (va )?ten|ho ten|ho va ten hoc sinh|ten hoc sinh|hoc sinh|ho, ten)/.test(h) && nameCol < 0) { nameCol = j; hdr = i; }
      else if (/^ho( dem| lot| va chu lot)?$/.test(h)) { hoCol = j; hdr = i; }
      else if (/^ten$/.test(h)) tenCol = j;
    });
  }
  let out = [];
  if (nameCol >= 0) out = rows.slice(hdr + 1).map(r => (r || [])[nameCol]);
  else if (hoCol >= 0 && tenCol >= 0) out = rows.slice(hdr + 1).map(r => [(r || [])[hoCol], (r || [])[tenCol]].filter(Boolean).join(' '));
  else { // no header: pick the column with the most name-like cells
    const cnt = {}; rows.forEach(r => (r || []).forEach((v, j) => { if (looksName(v)) cnt[j] = (cnt[j] || 0) + 1; }));
    const best = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
    if (best != null) out = rows.map(r => (r || [])[best]);
  }
  return out.map(v => String(v || '').replace(/\s+/g, ' ').trim()).filter(looksName);
}
let importSheets = null;
async function importClassFile(file){
  try {
    let sheets;
    if (/\.(csv|txt)$/i.test(file.name)) sheets = [{ name: file.name.replace(/\.\w+$/, ''), rows: parseCSV(await file.text()) }];
    else if (/\.xls$/i.test(file.name)) { toast('File .xls đời cũ: thầy mở bằng Excel → Lưu thành (Save As) → chọn .xlsx rồi nhập lại', 5000); return; }
    else sheets = await readXlsx(await file.arrayBuffer());
    importSheets = sheets.map(s => ({ name: s.name, names: namesFromRows(s.rows) })).filter(s => s.names.length);
    if (!importSheets.length) { toast('Không tìm thấy cột họ tên trong file', 4000); return; }
    importSheets.sort((a, b) => b.names.length - a.names.length);
    useImportSheet(0);
  } catch (e) { toast('Không đọc được file. Hãy chọn file Excel .xlsx', 4000); }
}
function useImportSheet(i){

}
function syncClassForm(){ if ($('#cName')) editingClass.name = $('#cName').value; if ($('#cText')) editingClass.text = $('#cText').value; }

function saveClass(){

function delClass(id){ const c = DB.classes.find(x => x.id === id); if (!confirm('Xoá lớp ' + c.name + '?')) return; DB.classes = DB.classes.filter(x => x.id !== id); save(); render(); }

    <label class="f">Tên trường in trên phiếu</label><input type="text" value="${esc(s.school || '')}" onchange="DB.settings.school=this.value;save();render()">
    <label class="f">Tên bài in sẵn (không bắt buộc)</label><input type="text" value="${esc(s.title || '')}" onchange="DB.settings.title=this.value;save();render()">
    <label class="f">Khổ giấy</label><select onchange="DB.settings.paper=this.value;save()">

async function installApp(){ if (!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice.catch(() => {}); deferredInstall = null; render(); }
function printSheet(both){

function backup(){ const d = JSON.parse(JSON.stringify(DB)); d.settings.aiKey = ''; download(new Blob([JSON.stringify(d)], { type: 'application/json' }), `chambai_saoluu_${new Date().toISOString().slice(0, 10)}.json`); }
